[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "multi-agent-rag"
version = "0.1.0"
description = "Multi-Agent Document Analysis System with MCP orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["rag", "multi-agent", "mcp", "llm", "chromadb", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["rag_system"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
