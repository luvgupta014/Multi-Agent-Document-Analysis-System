gemini:
  model_name: gemini-2.5-flash
  temperature: 0.3
  max_output_tokens: 2048

llm:
  provider: gemini          # options: gemini, openai, ollama
  model_name: gemini-2.5-flash
  temperature: 0.3
  max_tokens: 2048
  # base_url:               # for ollama (default: http://localhost:11434)
  #                         # or any OpenAI-compatible endpoint

mcp_server:
  host: 0.0.0.0
  port: 8000

specialist:
  agent_id: specialist_climate
  name: Climate Document Specialist
  description: Expert in climate change, environmental science, renewable energy, data pipelines, and ML model performance
  collection_name: climate_docs
  port: 8001

manager_api:
  port: 8002

knowledge_base:
  doc_dir: docs/sample_documents
  file_pattern: "*"           # supports .txt and .pdf
  chunk_size: 500
  chunk_overlap: 50
  persist_dir: ./chroma_db

embedding:
  model_name: all-MiniLM-L6-v2

retrieval:
  top_k: 5
  similarity_threshold: 0.3  # discard chunks below this cosine similarity score
  hybrid: true               # BM25 + dense vector search fused with RRF
  rerank: false              # cross-encoder re-ranking (slower but more accurate)
  rrf_k: 60                  # RRF constant; higher = less weight on rank position

chunking:
  strategy: recursive        # options: sentence_aware, recursive

agents:
  memory_turns: 5           # number of recent conversation turns to keep in context
  sql_db_path: data/sample.db
  sql_port: 8003
  web_search_enabled: true
  web_search_port: 8004

api:
  key: ""                   # set via API_KEY env var; leave blank to disable auth
  rate_limit_per_minute: 60 # 0 to disable rate limiting

security:
  prompt_injection_filter: true
  filter_mode: drop         # options: drop, redact

tracing:
  enabled: true             # activates only when LANGFUSE_PUBLIC_KEY & LANGFUSE_SECRET_KEY are set

logging:
  level: INFO
  log_dir: logs
  rotation: 10 MB
  retention: 7 days
  json_logs: false           # set true for structured JSON output (Datadog/Loki compatible)
