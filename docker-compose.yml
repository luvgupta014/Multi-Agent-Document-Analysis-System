version: "3.8"

services:
  mcp-server:
    build: .
    container_name: mcp-server
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - chroma_data:/app/chroma_db
    command: python run_mcp_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  init-kb:
    build: .
    container_name: init-knowledge-base
    volumes:
      - chroma_data:/app/chroma_db
      - ./docs:/app/docs
    environment:
      - FORCE_RELOAD=true
    command: python setup_knowledge_base.py
    depends_on:
      mcp-server:
        condition: service_healthy

  specialist:
    build: .
    container_name: specialist-climate
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
      - chroma_data:/app/chroma_db
      - ./docs:/app/docs
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000
      - SPECIALIST_HOST=specialist
    command: python run_specialist.py
    depends_on:
      init-kb:
        condition: service_completed_successfully

  sql-specialist:
    build: .
    container_name: specialist-sql
    ports:
      - "8003:8003"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000
      - SQL_SPECIALIST_HOST=sql-specialist
    command: python run_sql_specialist.py
    depends_on:
      mcp-server:
        condition: service_healthy

  web-search:
    build: .
    container_name: specialist-web-search
    ports:
      - "8004:8004"
    volumes:
      - ./logs:/app/logs
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000
      - WEB_SEARCH_HOST=web-search
    command: python run_web_search.py
    depends_on:
      mcp-server:
        condition: service_healthy

  manager-repl:
    build: .
    container_name: manager-repl
    volumes:
      - ./logs:/app/logs
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:8000
    command: python run_manager.py
    depends_on:
      - specialist
    stdin_open: true
    tty: true
    profiles: [repl]

  manager-api:
    build: .
    container_name: manager-api
    ports:
      - "8002:8002"
    volumes:
      - ./logs:/app/logs
      - chroma_data:/app/chroma_db
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:8000
    command: python run_api.py
    depends_on:
      - specialist
    profiles: [api]

volumes:
  chroma_data:
